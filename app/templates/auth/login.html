{% extends "base.html" %}
{% block title %}Sign in — ScholarForge{% endblock %}

{% block layout %}
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-brand">
      <div class="auth-brand-icon">SF</div>
      <div class="auth-brand-name">ScholarForge</div>
      <div class="auth-brand-tag">Research · Write · Cite</div>
    </div>

    <div class="auth-card">
      <div class="auth-card-title">Welcome back</div>
      <div class="auth-card-subtitle">Sign in to continue to your research workspace.</div>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/auth/login">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required autofocus
                 placeholder="you@university.edu">
        </div>
        <div class="field" style="margin-bottom:20px">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required
                 placeholder="••••••••">
        </div>
        <button class="auth-submit" type="submit">Sign in</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/auth/signup">Create one</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
